
name: Build MEZO ROYAL APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract game files
        run: |
          unzip -q MEZO_ROYAL_Source_Project.zip -d project
          mkdir -p project/MEZO_ROYAL_Project/build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Create debug key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Create Android preset
        run: |
          cat > project/MEZO_ROYAL_Project/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MEZO_ROYAL.apk"

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.mezo.royal"
          package/name="MEZO ROYAL"
          package/signed=true
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          screen/immersive_mode=true
          EOF

      - name: Build APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: project/MEZO_ROYAL_Project
          presets_to_export: Android
          export_debug: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MEZO-ROYAL-APK
          path: project/MEZO_ROYAL_Project/build/MEZO_ROYAL.apk
